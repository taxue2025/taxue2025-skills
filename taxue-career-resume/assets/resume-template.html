<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__</title>
<style>
  /* ===== 简历打印样式：独立单文件，零外部依赖 ===== */
  :root {
    --ink: #1a1a1a;
    --muted: #555555;
    --rule: #c9c9c9;
    --accent: #1a5fb4;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    font-size: 11pt;
    line-height: 1.55;
    color: var(--ink);
    background: #f3f3f3;
  }

  .sheet {
    max-width: 210mm;
    margin: 16px auto;
    background: #ffffff;
    padding: 14mm 16mm;
    box-shadow: 0 2px 12px rgba(0,0,0,0.12);
  }

  /* 头部 */
  .head { border-bottom: 2px solid var(--accent); padding-bottom: 8px; margin-bottom: 12px; }
  .head h1 { font-size: 22pt; line-height: 1.2; letter-spacing: 0.5px; }
  .head .role { font-size: 12pt; color: var(--accent); font-weight: 600; margin-top: 2px; }
  .contact { margin-top: 6px; font-size: 9.5pt; color: var(--muted); }
  .contact span { margin-right: 14px; white-space: nowrap; }

  /* 区块 */
  section { margin-bottom: 11px; }
  section h2 {
    font-size: 12pt;
    color: var(--accent);
    border-bottom: 1px solid var(--rule);
    padding-bottom: 2px;
    margin-bottom: 6px;
    letter-spacing: 1px;
  }

  .summary p { font-size: 10.5pt; }

  /* 技能 */
  .skills p { font-size: 10.5pt; }
  .skills .hard { margin-bottom: 2px; }
  .skills .soft { color: var(--muted); }

  /* 经历条目 */
  .entry { margin-bottom: 8px; }
  .entry:last-child { margin-bottom: 0; }
  .entry-head { display: flex; justify-content: space-between; align-items: baseline; }
  .entry-head .what { font-weight: 700; font-size: 10.5pt; }
  .entry-head .when { font-size: 9.5pt; color: var(--muted); white-space: nowrap; padding-left: 12px; }
  .entry ul { list-style: none; margin-top: 2px; }
  .entry li {
    position: relative;
    padding-left: 12px;
    font-size: 10pt;
  }
  .entry li::before { content: "–"; position: absolute; left: 0; color: var(--accent); }
  .entry .tags { margin-top: 2px; font-size: 9pt; color: var(--muted); }

  /* 教育/证书/语言 */
  .edu-line, .cert-line, .lang-line {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 10.5pt;
  }
  .edu-line .when, .cert-line .when { font-size: 9.5pt; color: var(--muted); white-space: nowrap; padding-left: 12px; }

  /* 屏幕端多页时可分段，打印端禁止跨页断裂 */
  .entry, section { break-inside: avoid; page-break-inside: avoid; }

  @media print {
    body { background: #ffffff; }
    .sheet { max-width: none; margin: 0; padding: 0; box-shadow: none; }
    @page { size: A4; margin: 12mm 14mm; }
  }

  @media (max-width: 640px) {
    .sheet { margin: 0; padding: 10mm 8mm; box-shadow: none; }
    .contact span { display: block; margin-right: 0; }
    .entry-head { flex-direction: column; }
    .entry-head .when { padding-left: 0; }
  }
</style>
</head>
<body>
  <main class="sheet">
__BODY__
  </main>
</body>
</html>
